<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visor Markdown — Sistema Logística</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; }
  header { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
           padding:12px 24px; background:#0f172a; border-bottom:1px solid #1e293b; }
  header .volver { color:#60a5fa; text-decoration:none; font-size:14px; white-space:nowrap; }
  header .volver:hover { text-decoration:underline; }
  header h1 { font-size:15px; font-weight:600; flex:1; min-width:200px;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acciones { display:flex; gap:8px; }
  .btn { font-size:12px; color:#cbd5e1; text-decoration:none; background:#1e293b;
         border:1px solid #334155; border-radius:6px; padding:6px 12px; white-space:nowrap; }
  .btn:hover { border-color:#60a5fa; color:#93c5fd; }
  #estado { padding:60px 24px; text-align:center; color:#94a3b8; font-size:15px; }
  #estado.error { color:#f87171; }
  #doc { max-width:900px; margin:0 auto; padding:32px 24px 60px; background:#fff; color:#1e293b;
         min-height:100vh; }
  #doc h1, #doc h2, #doc h3, #doc h4 { margin:1.4em 0 .5em; line-height:1.3; color:#0f172a; }
  #doc h1 { font-size:26px; border-bottom:2px solid #e2e8f0; padding-bottom:8px; }
  #doc h2 { font-size:21px; border-bottom:1px solid #e2e8f0; padding-bottom:6px; }
  #doc h3 { font-size:17px; }
  #doc p, #doc li { line-height:1.65; font-size:15px; }
  #doc ul, #doc ol { padding-left:26px; margin:.6em 0; }
  #doc a { color:#2563eb; }
  #doc code { background:#f1f5f9; border-radius:4px; padding:1px 6px; font-size:13px; color:#be185d; }
  #doc pre { background:#0f172a; color:#e2e8f0; border-radius:8px; padding:14px 16px;
             overflow:auto; margin:.8em 0; }
  #doc pre code { background:none; color:inherit; padding:0; }
  #doc table { border-collapse:collapse; margin:.9em 0; width:100%; font-size:14px; }
  #doc th, #doc td { border:1px solid #cbd5e1; padding:7px 10px; text-align:left; }
  #doc th { background:#f1f5f9; }
  #doc tr:nth-child(even) td { background:#f8fafc; }
  #doc img { max-width:100%; border:1px solid #e2e8f0; border-radius:6px; margin:.6em 0; }
  #doc blockquote { border-left:4px solid #cbd5e1; padding:4px 16px; color:#475569; margin:.8em 0; }
  #doc hr { border:none; border-top:1px solid #e2e8f0; margin:1.6em 0; }
  @media (max-width:700px) {
    header { padding:10px 12px; gap:8px; }
    header h1 { font-size:13px; min-width:120px; }
    #doc { padding:22px 14px 50px; }
    #doc table { display:block; overflow-x:auto; }
    #doc pre { font-size:12px; }
  }
</style>
<script src="solo-rol.js"></script>
</head>
<body>
<header>
  <a class="volver" href="index.html">← Portal</a>
  <h1 id="titulo">Documento</h1>
  <div class="acciones">
    <a class="btn" id="btnFuente" href="#">Ver fuente .md</a>
    <a class="btn" href="anexo.html">Anexo documental</a>
  </div>
</header>
<div id="estado">Cargando documento…</div>
<div id="doc"></div>

<script src="lib/marked.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
const doc = params.get('doc');
const estado = document.getElementById('estado');
const cont = document.getElementById('doc');

if (!doc) {
  estado.textContent = 'Falta el parámetro ?doc=<archivo>.md';
  estado.classList.add('error');
} else {
  const nombre = decodeURIComponent(doc).split('/').pop();
  document.getElementById('titulo').textContent = nombre;
  document.title = nombre + ' — Visor Markdown';
  document.getElementById('btnFuente').href = doc;
  // Reintenta subiendo un nivel si el path relativo no alcanza
  const candidatos = [doc, '../' + doc, '../../' + doc];
  let docReal = doc;
  const cargar = (i) => fetch(candidatos[i]).then(r => {
    if (!r.ok) {
      if (i < candidatos.length - 1) return cargar(i + 1);
      throw new Error('HTTP ' + r.status);
    }
    docReal = candidatos[i];
    return r;
  });

  cargar(0)
    .then(r => r.text())
    .then(text => {
      const baseDir = docReal.slice(0, docReal.lastIndexOf('/') + 1);
      cont.innerHTML = marked.parse(text);
      // Resolver rutas relativas de imágenes y enlaces contra la carpeta del .md
      cont.querySelectorAll('img').forEach(img => {
        const s = img.getAttribute('src');
        if (s && !/^(https?:|data:|\/)/i.test(s)) img.src = baseDir + s;
      });
      cont.querySelectorAll('a').forEach(a => {
        const h = a.getAttribute('href');
        if (!h || /^(https?:|#|mailto:|\/)/i.test(h)) return;
        const abs = baseDir + h;
        if (/\.md$/i.test(h)) a.href = 'visor-md.html?doc=' + encodeURIComponent(abs);
        else if (/\.docx$/i.test(h)) a.href = 'visor-docx.html?doc=' + encodeURIComponent(abs);
        else a.href = abs;
      });
      estado.style.display = 'none';
    })
    .catch(e => {
      estado.classList.add('error');
      estado.innerHTML = 'No se pudo mostrar <b>' + nombre + '</b> (' + e.message + ').<br><br>' +
        '<a class="btn" href="' + doc + '">Abrir archivo fuente</a>';
    });
}
</script>
</body>
</html>
