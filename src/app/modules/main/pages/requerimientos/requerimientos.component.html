<div class="requerimientos-container">
  <div class="container container-card py-4">

    <!-- ===================== -->
    <!-- NAVEGACION DE TABS -->
    <!-- ===================== -->
    <ul class="nav nav-tabs mb-3 custom-tabs">
      <li class="nav-item">
        <button class="nav-link" [ngClass]="{ active: tabActiva === 'ITEM' }" (click)="cambiarTab('ITEM')">
          <i class="bx bx-file me-2"></i>
          Items
        </button>
      </li>
      <!-- ALLOGIST solo ve tab COMPRA (ITEM), ocultar otros tabs -->
      @if (!esAlmacen) {
      <li class="nav-item">
        <button class="nav-link" [ngClass]="{ active: tabActiva === 'COMMODITY' }" (click)="cambiarTab('COMMODITY')">
          <i class="bx bx-cog me-2"></i>
          Servicios
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" [ngClass]="{ active: tabActiva === 'ACTIVOFIJO' }" (click)="cambiarTab('ACTIVOFIJO')">
          <i class="bx bx-building me-2"></i>
          Activos Fijos
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" [ngClass]="{ active: tabActiva === 'ACTIVOFIJOMENOR' }" (click)="cambiarTab('ACTIVOFIJOMENOR')">
          <i class="bx bx-box me-2"></i>
          Activos Menores
        </button>
      </li>
      }
    </ul>

    <!-- ===================== -->
    <!-- CONTENIDO POR TAB (componentes hijos) -->
    <!-- ===================== -->

    <!-- TAB ITEM -->
    <app-tab-item
      *ngIf="tabActiva === 'ITEM'"
      (tipoChange)="TipoSelecionado = $any($event)"
      (prioridadChange)="SeleccionaPrioridadITEM = $any($event)"
      (almacenChange)="almacenSeleccionado = $event"
      (almacenOrigenChange)="almacenOrigen = $event"
      (almacenDestinoChange)="almacenDestino = $event"
      (glosaChange)="glosa = $event"
      (guardarEvt)="guardar()"
      (guardarEdicionEvt)="guardarEdicion()"
      (cancelarEvt)="cancelar()"
      (nuevoEvt)="nuevoRequerimiento()"
      (tipoChangeEvt)="onTipoChange()"
      (cargaMasivaGuardadaEvt)="cargarRequerimientos()"
      (editarEvt)="editarRequerimiento($event)"
      (copiarEvt)="copiarRequerimiento($event)"
      (eliminarEvt)="eliminarRequerimiento($event)"
      (editarSelectEvt)="editarRequerimientoSelect($event)"
      (copiarSelectEvt)="copiarRequerimientoSelect($event)"
      (eliminarSelectEvt)="eliminarRequerimientoSelect($event)"
      (checkChangeEvt)="onCheckChange($event.event, $event.row)"
      (sincronizarEvt)="sincronizarPendientes()"
      (areaDetectadaEvt)="maestrasSvc.areaSeleccionada = $event"
      [requerimientos]="requerimientos"
      [loading]="loading"
      [sinenviar]="sinenviar"
      [enviados]="enviados"
      [modoItemPrincipal]="modoItemPrincipal"
      [verBotones]="verBotones"
      [dataSelected]="dataSelected"
      [TipoSelecionado]="TipoSelecionado"
      [SeleccionaPrioridadITEM]="SeleccionaPrioridadITEM"
      [almacenSeleccionado]="almacenSeleccionado"
      [almacenes]="almacenes"
      [almacenOrigen]="almacenOrigen"
      [almacenDestino]="almacenDestino"
      [alamcenesDestino]="alamcenesDestino"
      [itemsFiltrados]="itemsFiltrados"
      [turnos]="turnos"
      [activosFijosFiltrados]="activosFijosFiltrados"
      [items]="items"
      [turnosParaCarga]="turnos"
    ></app-tab-item>

    <!-- TAB COMMODITY -->
    <app-tab-commodity
      *ngIf="tabActiva === 'COMMODITY'"
      (prioridadChange)="SeleccionaPrioridadCOMMODITY = $any($event)"
      (glosaChange)="glosaCommodity = $event"
      (servicioChange)="SeleccionaServicio = $event; onServicioChange()"
      (editarEvt)="editarCommodity($event)"
      (eliminarEvt)="eliminarCommodity($event)"
      (checkChangeEvt)="onCheckChangeCommodity($event.event, $event.row)"
      (sincronizarEvt)="sincronizarPendientesCommodity()"
      (nuevoEvt)="nuevoCommodity()"
      (editarSelectEvt)="editarRequerimientoCommoditySelect($event)"
      (eliminarSelectEvt)="eliminarRequerimientoCommoditySelect($event)"
      (guardarEvt)="guardarCommodity()"
      (guardarEdicionEvt)="guardarCommodity()"
      (cancelarEvt)="cancelarCommodity()"
      [requerimientosCommodity]="requerimientosCommodity"
      [loading]="loading"
      [sinenviarCommodity]="sinenviarCommodity"
      [enviadosCommodity]="enviadosCommodity"
      [modoItemPrincipal]="modoItemPrincipal"
      [verBotones]="verBotones"
      [dataSelectedCommodity]="dataSelectedCommodity"
      [TipoSelecionado]="TipoSelecionado"
      [SeleccionaPrioridadCommodity]="SeleccionaPrioridadCOMMODITY"
      [servicioSeleccionado]="SeleccionaServicio"
      [servicios]="commodityFiltrados"
      [subservicioFiltrados]="subservicioFiltrados"
      [turnos]="turnos"
      [modalCecoData]="modalCecoData"
      [modalLaborData]="modalLaborData"
      [modalProyectoData]="modalProyectoData"
      [modalTurnoEditable]="modalTurnoEditable"
      [modalTurnoDisabled]="modalTurnoDisabled"
      [modalCecoEditable]="modalCecoEditable"
      [modalCecoDisabled]="modalCecoDisabled"
      [modalLaborEditable]="modalLaborEditable"
      [modalLaborDisabled]="modalLaborDisabled"
      [modalProyectoEditable]="modalProyectoEditable"
      [modalProyectoDisabled]="modalProyectoDisabled"
    ></app-tab-commodity>

    <!-- TAB ACTIVO FIJO -->
    <app-tab-activo-fijo
      *ngIf="tabActiva === 'ACTIVOFIJO'"
      (prioridadChange)="SeleccionaPrioridadACTIVOFIJO = $any($event)"
      (glosaChange)="glosaActivoFijo = $event"
      (servicioChange)="SeleccionaServicioAF = $event; onServicioAFChange()"
      (editarEvt)="editarActivoFijo($event)"
      (eliminarEvt)="eliminarActivoFijo($event)"
      (nuevoEvt)="nuevoActivoFijo()"
      (sincronizarEvt)="sincronizarPendientesActivoFijo()"
      (editarSelectEvt)="editarRequerimientoActivoFijoSelect($event)"
      (eliminarSelectEvt)="eliminarRequerimientoActivoFijoSelect($event)"
      (checkChangeEvt)="onCheckChangeActivoFIjo($event.event, $event.row)"
      (guardarEvt)="guardarActivoFijo()"
      (cancelarEvt)="cancelarActivoFijo()"
      [requerimientosActivoFijo]="requerimientosActivoFijo"
      [sinenviarActivoFijo]="sinenviarActivoFijo"
      [enviadosActivoFijo]="enviadosActivoFijo"
      [modoItemPrincipal]="modoItemPrincipal"
      [verBotones]="verBotones"
      [dataSelectedActivoFijo]="dataSelectedActivoFijo"
      [TipoSelecionado]="TipoSelecionado"
      [SeleccionaPrioridadActivoFijo]="SeleccionaPrioridadACTIVOFIJO"
      [servicioActivoFijo]="SeleccionaServicioAF"
      [serviciosActivoFijo]="commodityFiltradosAF"
      [subservicioFiltradosAF]="subservicioFiltradosAF"
      [activosFijosServicioFiltrados]="activosFijosServicioFiltrados"
      [turnos]="turnos"
      [modalCecoData]="modalCecoData"
      [modalLaborData]="modalLaborData"
      [modalProyectoData]="modalProyectoData"
      [modalTurnoEditable]="modalTurnoEditable"
      [modalTurnoDisabled]="modalTurnoDisabled"
      [modalCecoEditable]="modalCecoEditable"
      [modalCecoDisabled]="modalCecoDisabled"
      [modalLaborEditable]="modalLaborEditable"
      [modalLaborDisabled]="modalLaborDisabled"
      [modalProyectoEditable]="modalProyectoEditable"
      [modalProyectoDisabled]="modalProyectoDisabled"
    ></app-tab-activo-fijo>

    <!-- TAB ACTIVO FIJO MENOR -->
    <app-tab-activo-menor
      *ngIf="tabActiva === 'ACTIVOFIJOMENOR'"
      (prioridadChange)="SeleccionaPrioridadACTIVOFIJOMENOR = $any($event)"
      (glosaChange)="glosaActivoFijoMenor = $event"
      (servicioChange)="SeleccionaServicioAFMenor = $event; onServicioAFMenorChange()"
      (editarEvt)="editarActivoFijoMenor($event)"
      (eliminarEvt)="eliminarActivoFijoMenor($event)"
      (nuevoEvt)="nuevoActivoFijoMenor()"
      (sincronizarEvt)="sincronizarPendientesActivoFijoMenor()"
      (editarSelectEvt)="editarRequerimientoActivoFijoMenorSelect($event)"
      (eliminarSelectEvt)="eliminarRequerimientoActivoFijoMenorSelect($event)"
      (checkChangeEvt)="onCheckChangeActivoFIjoMenor($event.event, $event.row)"
      (guardarEvt)="guardarActivoFijoMenor()"
      (cancelarEvt)="cancelarActivoFijoMenor()"
      [requerimientosActivoFijoMenor]="requerimientosActivoFijoMenor"
      [sienvinarActivoFijoMenor]="sienvinarActivoFijoMenor"
      [enviadosActivoFijoMenor]="enviadosActivoFijoMenor"
      [modoItemPrincipal]="modoItemPrincipal"
      [verBotonesActivoFijoMenor]="verBotonesActivoFijoMenor"
      [dataSelectedActivoFijoMenor]="dataSelectedActivoFijoMenor"
      [TipoSelecionado]="TipoSelecionado"
      [SeleccionaPrioridadActivoFijoMenor]="SeleccionaPrioridadACTIVOFIJOMENOR"
      [servicioActivoFijoMenor]="SeleccionaServicioAFMenor"
      [serviciosActivoFijoMenor]="commodityFiltradosAFMenor"
      [subservicioFiltradosAFMenor]="subservicioFiltradosAFMenor"
      [activosFijosServicioFiltrados]="activosFijosServicioFiltrados"
      [turnos]="turnos"
      [modalCecoData]="modalCecoData"
      [modalLaborData]="modalLaborData"
      [modalProyectoData]="modalProyectoData"
      [modalTurnoEditable]="modalTurnoEditable"
      [modalTurnoDisabled]="modalTurnoDisabled"
      [modalCecoEditable]="modalCecoEditable"
      [modalCecoDisabled]="modalCecoDisabled"
      [modalLaborEditable]="modalLaborEditable"
      [modalLaborDisabled]="modalLaborDisabled"
      [modalProyectoEditable]="modalProyectoEditable"
      [modalProyectoDisabled]="modalProyectoDisabled"
    ></app-tab-activo-menor>

    <!-- MODAL STOCK - GLOBAL (aplica a todos los tabs) -->
    <app-modal-stock-validacion
      [visible]="modalStockAbierto"
      [itemsStock]="itemsStockValidacion"
      (cerrarEvt)="cerrarModalStock()"
      (confirmarEvt)="confirmarAjusteStock()"
    ></app-modal-stock-validacion>

  </div>
</div>
