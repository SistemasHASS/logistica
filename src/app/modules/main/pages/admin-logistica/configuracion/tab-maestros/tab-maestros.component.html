<div class="container-fluid mt-2">
  <ul class="nav nav-pills mb-3 flex-wrap gap-1">
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab() === 'items'" (click)="setTab('items')">
        <i class="bx bx-cube me-1"></i> Items
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab() === 'comodities'" (click)="setTab('comodities')">
        <i class="bx bx-list-ul me-1"></i> Commodities
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab() === 'unidades'" (click)="setTab('unidades')">
        <i class="bx bx-ruler me-1"></i> Unidades de Medida
      </button>
    </li>
  </ul>

  @if (activeTab() === 'items') {
    <app-maestros-items></app-maestros-items>
  }
  @if (activeTab() === 'comodities') {
    <app-maestros-comodities></app-maestros-comodities>
  }
  @if (activeTab() === 'unidades') {
    <app-maestros-unidades-medida></app-maestros-unidades-medida>
  }
</div>
