<div class="admin-page">

  <!-- HEADER -->
  <div class="page-header">
    <h2>Lista de Áreas</h2>
    <div>
      <!-- <button class="btn-secondary me-2" (click)="cargarAreas()" [disabled]="loading">
        <i class="icon-refresh"></i> Recargar
      </button> -->
      <button class="btn-primary" (click)="openCreate()">
        <i class="icon icon-plus"></i> Nueva Área
      </button>
    </div>
  </div>

  <!-- TABLA -->
  <div class="table-wrapper">
    <p-table
      [value]="areas"
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
      [showCurrentPageReport]="true"
      [rowsPerPageOptions]="[10, 25, 50]"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} registros"
      styleClass="p-datatable-sm"
      responsiveLayout="scroll">

      <ng-template pTemplate="header">
        <tr>
          <th style="width: 60px">#</th>
          <th>Área</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th style="width: 120px">Acciones</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-area let-i="rowIndex">
        <tr>
          <td>{{ i + 1 }}</td>
          <td>{{ area.descripcion }}</td>
          <td>{{ area.descripcion }}</td>
          <td>
            <span [class.activo]="area.estado" [class.inactivo]="!area.estado">
              {{ area.estadoTexto || (area.estado ? 'Activo' : 'Inactivo') }}
            </span>
          </td>
          <td class="actions">
            <button class="btn btn-sm btn-warning me-2" (click)="openEdit(area)">
              <i class="icon-pencil"></i>
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="empty">
            No hay áreas registradas
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>

<!-- MODAL -->
<div class="modal-backdrop" *ngIf="showModal">
  <div class="modal" [class.show]="showModal">
    <div class="modal-header">
      <h3>{{ isEdit ? 'Editar Área' : 'Nueva Área' }}</h3>
      <button class="close" (click)="closeModal()">×</button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" [(ngModel)]="form.nombre" />
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea rows="3" [(ngModel)]="form.descripcion"></textarea>
      </div>

      <div class="form-group">
        <label>Estado</label>
        <select [(ngModel)]="form.estado">
          <option value="ACTIVO">Activo</option>
          <option value="INACTIVO">Inactivo</option>
        </select>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="closeModal()">Cancelar</button>
      <button class="btn-primary" (click)="save()">Guardar</button>
    </div>
  </div>
</div>
