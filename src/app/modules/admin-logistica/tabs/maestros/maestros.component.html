<div class="maestros-container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="m-0 fw-bold">Gestión de Maestros</h4>
  </div>

  <div class="card">
    <div class="card-header">
      <ul class="nav nav-tabs card-header-tabs flex-wrap">
        <li class="nav-item">
          <button class="nav-link" [class.active]="activeTab() === 'items'" (click)="setTab('items')">
            <i class="bx bx-cube me-2"></i>Items
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" [class.active]="activeTab() === 'comodities'" (click)="setTab('comodities')">
            <i class="bx bx-list-ul me-2"></i>Commodities
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" [class.active]="activeTab() === 'unidades'" (click)="setTab('unidades')">
            <i class="bx bx-ruler me-2"></i>Unidades de Medida
          </button>
        </li>
      </ul>
    </div>
    <div class="card-body p-0">
      @if (activeTab() === 'items') {
        <app-maestros-items></app-maestros-items>
      }
      @if (activeTab() === 'comodities') {
        <app-maestros-comodities></app-maestros-comodities>
      }
      @if (activeTab() === 'unidades') {
        <app-maestros-unidades-medida></app-maestros-unidades-medida>
      }
    </div>
  </div>
</div>
